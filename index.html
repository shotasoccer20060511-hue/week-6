<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    
    <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6">BMI計算ツール</h1>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">身長（sm）</label>
            <input id="height" type="number" placeholder="例：170"
                class="w-full border border-gray-300 rounded px-3 py-2">    
        </div>

        <div class="mb-6">
            <label class="block text-sm font-midium text-gray-700 mb-1">体重(kg)</label>
            <input id="weight" type="number" placeholder="例：65"
                class="w-full border border-gray-300 rounded px-3 py-2">
        </div>

        <button id="calcBtn"
            class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
            計算する
        </button>
        
        <p id="result" class="mt-6 text-center items-center text-lg font-bold text-gray-800"></p>
    </div>

    <script src="./app.js"></script>
</body>
</html>
